<!DOCTYPE html>

<head>

    <!-- EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon-contact.png?v=1">
</head>

<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="index.html" class="logo">Imesh.</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#projects">Projects</a></li>
            <li><a href="blog.html">Blog</a></li>

        </ul>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <!-- MAIN -->
    <main style="padding-top: var(--nav-height);">

        <section id="contact" class="contact section-spacing">
            <div class="container">

                <h2 class="section-title fade-in">Get In <span>Touch</span></h2>

                <div class="contact-grid">

                    <!-- CONTACT INFO -->
                    <div class="contact-info fade-in">
                        <p class="contact-desc">
                            Got a project in mind, a question, or just want to say hello? Drop me a message or find me on my socials!
                        </p>

                        <div class="info-items">
                            <div class="info-item">
                                <i class="fa-solid fa-envelope"></i>
                                <div>
                                    <h4>Email</h4>
                                    <a href="mailto:imeshthiwanka200325@gmail.com">
                                        imeshthiwanka200325@gmail.com
                                    </a>
                                </div>
                            </div>

                            <div class="info-item">
                                <i class="fa-solid fa-phone"></i>
                                <div>
                                    <h4>Phone</h4>
                                    <a href="tel:+94719656728">
                                        071 965 6728
                                    </a>
                                </div>
                            </div>
                        </div>

                        <div class="social-links">
                            <a href="https://www.linkedin.com/in/imesh-thiwanka" target="_blank" class="social-icon">
                                <i class="fa-brands fa-linkedin-in"></i>
                            </a>
                            <a href="https://github.com/Imeshthiwanka" target="_blank" class="social-icon">
                                <i class="fa-brands fa-github"></i>
                            </a>
                            <a href="https://www.facebook.com/imeshthiwanka.thiwanka" target="_blank" class="social-icon">
                                <i class="fa-brands fa-facebook-f"></i>
                            </a>
                            <a href="https://medium.com/@imeshthiwanka200325" target="_blank" class="social-icon">
                                <i class="fa-brands fa-medium"></i>
                            </a>
                        </div>
                    </div>

                    <!-- CONTACT FORM -->
                    <div class="contact-form-wrapper fade-in delay-1">
                        <form id="contact-form" class="glass-panel">

                            <div class="form-group">
                                <input type="text" id="name" name="from_name" required placeholder="Your Name">
                            </div>

                            <div class="form-group">
                                <input type="email" id="email" name="from_email" required placeholder="Your Email">
                            </div>

                            <div class="form-group">
                                <textarea id="message" name="message" rows="5" required placeholder="Your Message"></textarea>
                            </div>

                            <button type="submit" class="btn primary-btn submit-btn">
                                Send Message
                            </button>

                            <div id="form-message" class="form-message hidden"></div>

                        </form>
                    </div>

                </div>
            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="footer">

            <p>&copy; 2026 <span>Imesh Thiwanka</span>. All rights reserved.</p>
